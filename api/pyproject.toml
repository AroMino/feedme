[project]
name = "api"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "AroMino", email = "arominorakotoarijaona@gmail.com"},
]
dependencies = ["numpy>=2.4.6", "google>=3.0.0", "google-genai>=2.8.0", "groq>=1.4.0", "python-dotenv", "dotenv>=0.9.9", "feedparser>=6.0.12", "trafilatura>=2.1.0", "psycopg2-binary>=2.9.12", "flask>=3.1.3", "flask-cors>=6.0.5"]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
